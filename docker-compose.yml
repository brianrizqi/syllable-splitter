services:
  web:
    build: .
    container_name: syllable-splitter-app
    # Host:Container. Default 8000 untuk lokal; di VPS jalankan: HOST_PORT=80 docker compose up -d
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      # Agar database CSV persisten tidak hilang saat container mati/restart
      - ./syllable_validations.csv:/app/syllable_validations.csv
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
